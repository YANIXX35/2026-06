services:
  - type: web
    name: antigaspi-2026
    env: docker
    envVars:
      - key: APP_NAME
        value: AntiGaspiCI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://antigaspi-2026.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: pg-1735a10e-yao91k-a724.h.aivencloud.com
      - key: DB_PORT
        value: "17354"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: TELESCOPE_ENABLED
        value: "false"

# Base de donnees : Aiven PostgreSQL (externe)
# Credentials a definir dans Render > Environment

